[project]
name = "apollo15-audio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "rich>=13",
    "numba",
    "tzdata",
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.1",
    "beautifulsoup4>=4.15.0",
    "pymupdf==2.1 ; python_full_version >= '3.11'",
    "pillow>=12.3.0",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
irig = ["numba"]

[tool.uv]
package = false
