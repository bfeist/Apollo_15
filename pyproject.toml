[project]
name = "apollo15-audio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "rich>=13",
    "numba",
    "tzdata",
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.1",
    "beautifulsoup4>=4.15.0",
    "pymupdf==2.1 ; python_full_version >= '3.11'",
    "pillow>=12.3.0",
    "lxml>=6.1.3",
    "opencv-python-headless>=4.10",
    # Forced alignment of the timing transcripts (scripts/00_common/mission_align.py).
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[project.optional-dependencies]
irig = ["numba"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
