<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apollo 15 transcript review</title>
<style>
  :root { --bg:#16181c; --panel:#1f2228; --line:#30343c; --text:#e4e6ea; --dim:#9aa0aa; --accent:#5aa9ff;
          --add:#2f6d3a; --del:#7a2f35; --pick:#3b5f8f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh;
         display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line);
           flex-wrap:wrap; }
  header .tabs button { margin-right:4px; }
  button, select, input, textarea { background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:4px; padding:4px 8px; font:inherit; }
  button:hover { border-color:var(--accent); cursor:pointer; }
  button.on { background:var(--pick); border-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #list { width:380px; border-right:1px solid var(--line); overflow:auto; }
  #list .row { padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list .row:hover { background:#252931; }
  #list .row.sel { background:#283447; }
  #list .row .meta { color:var(--dim); font-size:12px; }
  #list .row.done .meta::after { content:' ✓'; color:#7fd08a; }
  #pager { padding:6px 10px; color:var(--dim); }
  #detail { flex:1; overflow:auto; padding:12px 16px; }
  .reading { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0; background:var(--panel); }
  .reading.proposed { border-color:#6b8f3b; }
  .reading.chosen { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .reading h4 { margin:0 0 4px; font-size:12px; color:var(--dim); font-weight:600; text-transform:uppercase; }
  .reading h4 kbd { float:right; }
  .w-add { background:var(--add); border-radius:2px; }
  .w-del { background:var(--del); border-radius:2px; }
  .span { background:#6b5a1e; border-radius:2px; padding:0 2px; }
  .kv { color:var(--dim); font-size:12px; }
  .kv b { color:var(--text); font-weight:500; }
  .audio { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:10px 0; background:#1b1f26; }
  .audio audio { width:100%; margin:6px 0; }
  .audio .ctl { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .audio input[type=number] { width:70px; }
  .asr { font-size:12px; color:var(--dim); max-height:150px; overflow:auto; margin-top:6px; }
  .asr div { cursor:pointer; padding:1px 4px; }
  .asr div:hover { background:#252931; color:var(--text); }
  .warn { color:#e6b450; font-size:12px; }
  .err { color:#ff7b7b; }
  kbd { font:11px monospace; border:1px solid var(--line); border-radius:3px; padding:0 4px; color:var(--dim); }
  .choices { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .help { color:var(--dim); font-size:12px; }
  textarea { width:100%; height:44px; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <select id="filter">
    <option value="pending">Pending</option>
    <option value="decided">Decided</option>
    <option value="ai">Decided by AI</option>
    <option value="all">All rows</option>
  </select>
  <select id="kind"></select>
  <input id="search" placeholder="Search text / GET" size="22">
  <label>Reviewer <input id="reviewer" size="8"></label>
  <span class="help"><kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>space</kbd> play · <kbd>[</kbd>/<kbd>]</kbd> ∓2 s ·
    <kbd>1</kbd>–<kbd>5</kbd> choose &amp; save · <kbd>a</kbd> accept proposed</span>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><p class="help">Pick a row.</p></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let Q = {}, queue = localStorage.getItem('queue') || 'wording', rows = [], view = [], sel = -1, page = 0;
let place = null, cand = 0, start = 0;
const PAGE = 300;
$('#reviewer').value = localStorage.getItem('reviewer') || '';
$('#reviewer').onchange = e => localStorage.setItem('reviewer', e.target.value.trim());

async function api(path, opts) {
  const r = await fetch(path, opts); const v = await r.json();
  if (v && v.error) throw new Error(v.error); return v;
}
async function loadQueues() {
  Q = await api('/api/queues');
  $('#tabs').innerHTML = Object.entries(Q).map(([n, q]) =>
    `<button data-q="${n}" class="${n === queue ? 'on' : ''}">${n} <span class="kv">${q.pending}/${q.rows}</span></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { queue = b.dataset.q;
    localStorage.setItem('queue', queue); loadQueues().then(loadRows); });
}
const kindOf = r => queue === 'wording' ? r.kind : queue === 'editorial' ? r.reason : r.kind;
async function loadRows() {
  rows = await api(`/api/rows?queue=${queue}`);
  const kinds = [...new Set(rows.map(kindOf))].sort();
  $('#kind').innerHTML = '<option value="">All kinds</option>' + kinds.map(k =>
    `<option>${esc(k)}</option>`).join('');
  page = 0; applyFilter();
}
function applyFilter() {
  const f = $('#filter').value, k = $('#kind').value, s = $('#search').value.toLowerCase();
  view = rows.filter(r => (f === 'all' || (f === 'ai' ? r.status === 'ai' : (f === 'pending') === r._pending)) && (!k || kindOf(r) === k) &&
    (!s || JSON.stringify(r).toLowerCase().includes(s)));
  sel = -1; renderList(); if (view.length) select(0);
  else $('#detail').innerHTML = '<p class="help">No rows.</p>';
}
['#filter', '#kind'].forEach(id => $(id).onchange = () => { page = 0; applyFilter(); });
$('#search').oninput = () => { clearTimeout(window._t); window._t = setTimeout(() => { page = 0; applyFilter(); }, 250); };

function title(r) {
  if (queue === 'wording') return r.afj || r.alsj || r.printed;
  if (queue === 'editorial') return `[${r.span}] ${r.utterance}`;
  return `${r.tl} | ${r.ia} | ${r.oxr}`;
}
function renderList() {
  const part = view.slice(page * PAGE, (page + 1) * PAGE);
  $('#list').innerHTML = `<div id="pager">${view.length} rows ` +
    (view.length > PAGE ? `· page ${page + 1}/${Math.ceil(view.length / PAGE)} <button id="pp">‹</button><button id="np">›</button>` : '') +
    '</div>' + part.map((r, i) => {
      const j = page * PAGE + i;
      return `<div class="row ${j === sel ? 'sel' : ''} ${r._pending ? '' : 'done'}" data-i="${j}">
        <div class="meta">${esc(r.get || ('p' + r.pdf_page))} · ${esc(r.who || r.speaker || '')} · ${esc(kindOf(r))}</div>
        <div>${esc(String(title(r)).slice(0, 140))}</div></div>`;
    }).join('');
  document.querySelectorAll('#list .row').forEach(d => d.onclick = () => select(+d.dataset.i));
  const pp = $('#pp'), np = $('#np');
  if (pp) pp.onclick = () => { page = Math.max(0, page - 1); renderList(); };
  if (np) np.onclick = () => { page = Math.min(Math.ceil(view.length / PAGE) - 1, page + 1); renderList(); };
}

// ---- word diff (LCS) of a reading against a reference
const toks = s => String(s || '').split(/\s+/).filter(Boolean);
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');
function diffHtml(text, ref) {
  const a = toks(text), b = toks(ref).map(norm), an = a.map(norm);
  if (!ref || a.length * b.length > 400000) return esc(text);
  const n = a.length, m = b.length, L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = an[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0; const out = [];
  while (i < n) {
    if (j < m && an[i] === b[j]) { out.push(esc(a[i])); i++; j++; }
    else if (j < m && L[i][j + 1] >= L[i + 1][j]) j++;
    else { out.push(an[i] ? `<span class="w-add">${esc(a[i])}</span>` : esc(a[i])); i++; }
  }
  return out.join(' ');
}

function readingBox(name, text, ref, key, r) {
  const chosen = (queue === 'editorial' ? r.action : r.choice) === name;
  const proposed = r.proposed === name;
  return `<div class="reading ${chosen ? 'chosen' : ''} ${proposed ? 'proposed' : ''}">
    <h4>${name}${proposed ? ' · proposed' : ''}${chosen ? ' · chosen' : ''}<kbd>${key}</kbd></h4>
    <div>${text ? diffHtml(text, ref) : '<span class="kv">(none)</span>'}</div></div>`;
}

async function select(i) {
  if (i < 0 || i >= view.length) return;
  sel = i; const r = view[i];
  if (Math.floor(i / PAGE) !== page) page = Math.floor(i / PAGE);
  renderList();
  document.querySelector(`#list .row[data-i="${i}"]`)?.scrollIntoView({block: 'nearest'});
  const choices = Q[queue].choices;
  let body = '';
  if (queue === 'wording') {
    const ref = r.printed;
    const ctx = (label, text) => text ? `<div class="reading" style="opacity:.7"><h4>${label}</h4>${
      text.split(' ‖ ').map(t => `<div>${esc(t)}</div>`).join('')}</div>` : '';
    body = `<div class="kv">GET <b>${esc(r.get)}</b> · ${esc(r.who)} · kind <b>${esc(r.kind)}</b> · status <b>${esc(r.status)}</b> · event ${esc(r.event_id)}${r.joined ? ` · <b>joined</b> ${esc(r.joined)} (utterance breaks differ; texts shown combined)` : ''}</div>` +
      (r.moved ? `<div class="kv" style="color:var(--accent)">Words at the break, kept in a neighbouring row (not lost by either choice): ${esc(r.moved)}</div>` : '') +
      ctx('Row before (context, not chosen)', r.context_before) +
      readingBox('printed', r.printed, r.afj || r.alsj, 1, r) +
      readingBox('afj', r.afj, ref, 2, r) + readingBox('alsj', r.alsj, ref, 3, r) +
      ctx('Row after (context, not chosen)', r.context_after) +
      (r.ai_choice ? `<div class="kv" style="margin-top:6px">AI (${esc(r.ai_backend)}): <b>${esc(r.ai_choice)}</b> · ${esc(r.ai_basis)} · confidence ${esc(r.ai_confidence)}${r.status === 'ai' ? ' · <b>decided</b>' : ''} — ${esc(r.ai_reason)}</div>` : '') +
      `<p class="help">Highlighted words differ from the printed row (in the printed box: from the journal). The journal is proposed; listen to decide.</p>`;
  } else if (queue === 'editorial') {
    const marked = esc(r.utterance).replace(/⟦(.*?)⟧|\{\{(.*?)\}\}/g, (_, x, y) => `<span class="span">${x || y}</span>`);
    body = `<div class="kv">GET <b>${esc(r.get)}</b> · ${esc(r.speaker)} · reason <b>${esc(r.reason)}</b></div>
      <div class="reading"><h4>Span</h4><span class="span">${esc(r.span)}</span></div>
      <div class="reading"><h4>Utterance</h4>${marked}</div>
      <div class="reading"><h4>Printed 1971</h4>${esc(r.printed) || '<span class="kv">(none)</span>'}</div>
      <div class="kv">rule <b>${esc(r.rule_class)}/${esc(r.rule_action)}</b> · pdf <b>${esc(r.pdf)}</b> ·
        AI <b>${esc(r.ai_class)}/${esc(r.ai_action)}</b> (${esc(r.ai_confidence)})</div>
      <div class="kv">previous: ${esc(r.previous)}</div><div class="kv">next: ${esc(r.next)}</div>
      <p>Class <input id="cls" value="${esc(r.class || r.ai_class || r.rule_class)}" size="14"></p>`;
  } else {
    const ref = r.tl;
    body = `<div class="kv">PDF page <b>${esc(r.pdf_page)}</b> · ${esc(r.speaker)} · ${esc(r.kind)} ·
        <a href="${esc(r.scan_url)}" target="_blank" style="color:var(--accent)">scan</a></div>
      <div class="reading"><h4>Context</h4>${esc(r.context)}</div>` +
      readingBox('tl', r.tl, r.ia || r.oxr, 1, r) + readingBox('ia', r.ia, ref, 2, r) + readingBox('oxr', r.oxr, ref, 3, r) +
      `<div class="kv">Whisper (locator aid only): ${esc(r.asr) || '(none)'}</div>`;
  }
  const buttons = choices.map((c, k) => {
    const on = (queue === 'editorial' ? r.action : r.choice) === c;
    return `<button class="${on ? 'on' : ''}" data-c="${c}"><kbd>${k + 1}</kbd> ${c}</button>`;
  }).join('') + (r.proposed ? `<button data-c="${r.proposed}"><kbd>a</kbd> accept proposed (${r.proposed})</button>` : '');
  $('#detail').innerHTML = body + `<div class="choices">${buttons}</div>
    <textarea id="note" placeholder="Note">${esc(r.note)}</textarea><div id="msg" class="kv"></div>
    <div class="audio" id="audio"><span class="kv">Placing on the SG reels…</span></div>`;
  document.querySelectorAll('.choices button').forEach(b => b.onclick = () => save(b.dataset.c));
  try {
    place = await api(`/api/place?queue=${queue}&key=${encodeURIComponent(r[Q[queue].key])}`);
    if (view[sel] !== r) return;
    cand = 0; renderAudio(true);
  } catch (e) { $('#audio').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function wordsOf(r) { return toks(queue === 'wording' ? (r.afj || r.alsj || r.printed) : queue === 'editorial' ? r.utterance : r.context).length; }
function renderAudio(reset) {
  const r = view[sel], c = place.candidates[cand];
  const notes = place.notes.map(n => `<div class="warn">${esc(n)}</div>`).join('');
  if (!c) { $('#audio').innerHTML = notes || '<span class="kv">No audio.</span>'; return; }
  const pre = +($('#pre')?.value ?? localStorage.getItem('pre') ?? 3);
  const len = reset ? Math.min(60, Math.max(8, Math.round(wordsOf(r) / 2.5) + pre + 4)) : +$('#len').value;
  if (reset) start = Math.max(0, c.start_s - pre);
  const opts = place.candidates.map((x, k) => `<option value="${k}" ${k === cand ? 'selected' : ''}>
    ${x.reel} @ ${fmt(x.start_s)} · ${x.basis}${x.anchor_distance_s ? ' (' + x.anchor_distance_s + ' s from anchor)' : ''}</option>`).join('');
  $('#audio').innerHTML = `${notes}
    <div class="ctl"><select id="cand">${opts}</select>
      pre-roll <input id="pre" type="number" value="${pre}" step="1"> s
      length <input id="len" type="number" value="${len}" step="2"> s
      <button data-n="-5">−5</button><button data-n="-1">−1</button><button data-n="1">+1</button><button data-n="5">+5</button>
      <span class="kv">start ${fmt(start)}</span></div>
    ${c.note ? `<div class="warn">${esc(c.note)}</div>` : ''}
    <audio id="player" controls src="/api/audio?reel=${c.reel}&start=${start.toFixed(2)}&dur=${len}"></audio>
    <div class="kv">Whisper on the reel here (locator aid only; never a wording source):</div><div class="asr" id="asr">…</div>`;
  $('#cand').onchange = e => { cand = +e.target.value; renderAudio(true); };
  $('#pre').onchange = e => { localStorage.setItem('pre', e.target.value); renderAudio(true); };
  $('#len').onchange = () => renderAudio(false);
  document.querySelectorAll('#audio button[data-n]').forEach(b => b.onclick = () => nudge(+b.dataset.n));
  api(`/api/asr?reel=${c.reel}&start=${start}&end=${start + len}`).then(segs => {
    $('#asr').innerHTML = segs.map(s => `<div data-s="${s.s}">${fmt(s.s)} ${esc(s.text)}${s.flags.length ? ' <span class="warn">' + esc(s.flags.join(',')) + '</span>' : ''}</div>`).join('') || '(none)';
    document.querySelectorAll('#asr div[data-s]').forEach(d => d.onclick = () => { start = Math.max(0, +d.dataset.s - 1); renderAudio(false); play(); });
  }).catch(e => $('#asr').textContent = e.message);
}
function nudge(n) { start = Math.max(0, start + n); renderAudio(false); play(); }
function play() { const p = $('#player'); if (p) { p.currentTime = 0; p.play(); } }
const fmt = s => { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return `${h}:${String(m).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`; };

async function save(choice) {
  const r = view[sel], reviewer = $('#reviewer').value.trim();
  if (!reviewer) { $('#msg').innerHTML = '<span class="err">Enter a reviewer name first.</span>'; $('#reviewer').focus(); return; }
  localStorage.setItem('reviewer', reviewer);
  try {
    const res = await api('/api/save', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({queue, key: r[Q[queue].key], choice, reviewer, note: $('#note').value,
                            class: $('#cls')?.value || ''})});
    Object.assign(r, res.row, {_pending: false});
    Q[queue].pending = Math.max(0, Q[queue].pending - 1);
    document.querySelector(`#tabs button[data-q="${queue}"] .kv`).textContent = `${Q[queue].pending}/${Q[queue].rows}`;
    select(Math.min(sel + 1, view.length - 1));
  } catch (e) { $('#msg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  const p = $('#player');
  if (e.key === 'j') select(sel + 1);
  else if (e.key === 'k') select(sel - 1);
  else if (e.key === ' ') { e.preventDefault(); if (p) p.paused ? p.play() : p.pause(); }
  else if (e.key === '[') nudge(-2);
  else if (e.key === ']') nudge(2);
  else if (e.key === 'a' && view[sel]?.proposed) save(view[sel].proposed);
  else if (/^[1-5]$/.test(e.key)) { const c = Q[queue].choices[+e.key - 1]; if (c) save(c); }
});
loadQueues().then(loadRows).catch(e => $('#detail').innerHTML = `<p class="err">${esc(e.message)}</p>`);
</script>
</body>
</html>
